<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  .art{width:1024px;height:500px;position:relative;
    background:radial-gradient(120% 140% at 22% 40%, #CB5E35 0%, #C0532E 45%, #A8461F 100%);
    display:flex;align-items:center;font-family:'Inter',sans-serif}
  .glow{position:absolute;left:60px;top:50%;transform:translateY(-50%);
    width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle, rgba(251,247,242,.14) 0%, rgba(251,247,242,0) 68%)}
  .bowl{width:340px;height:340px;margin-left:70px;flex:none;position:relative;filter:drop-shadow(0 12px 30px rgba(90,30,10,.35))}
  .text{margin-left:56px}
  .word{font-family:'Fraunces',serif;font-weight:600;font-size:140px;line-height:.9;color:#FBF7F2;letter-spacing:-2px}
  .rule{width:96px;height:6px;border-radius:3px;background:#7FB08C;margin:22px 0 20px}
  .tag{font-size:34px;font-weight:500;color:#FBF7F2;opacity:.94;letter-spacing:.2px}
  .url{margin-top:30px;font-size:17px;font-weight:500;color:#FBF7F2;opacity:.5;letter-spacing:.6px}
</style></head>
<body>
<div class="art">
  <div class="glow"></div>
  <div class="bowl">
    <svg viewBox="0 0 1024 1024" width="340" height="340">
      <g fill="none" stroke="#FBF7F2" stroke-width="30" stroke-linecap="round">
        <path d="M430 424 C 398 372, 462 352, 430 300"/>
        <path d="M512 430 C 480 378, 544 358, 512 300"/>
        <path d="M594 424 C 562 372, 626 352, 594 300"/>
      </g>
      <ellipse cx="512" cy="520" rx="214" ry="48" fill="#FBF7F2"/>
      <path d="M300 520 A 214 214 0 0 0 724 520 Z" fill="#FBF7F2"/>
      <ellipse cx="512" cy="520" rx="150" ry="30" fill="#5E8B6A" opacity="0.22"/>
      <rect x="312" y="702" width="400" height="28" rx="14" fill="#7FB08C"/>
    </svg>
  </div>
  <div class="text">
    <div class="word">Sofra</div>
    <div class="rule"></div>
    <div class="tag">Your family's meal memory</div>
    <div class="url">sofra.savvylabs.dev</div>
  </div>
</div>
</body></html>
