<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden}
  .art{width:1080px;height:1080px;position:relative;font-family:'Inter',sans-serif;
    background:radial-gradient(120% 120% at 50% 34%, #CB5E35 0%, #C0532E 44%, #9E4019 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#FBF7F2}
  .bowl{filter:drop-shadow(0 16px 36px rgba(80,26,8,.4))}
  .word{font-family:'Fraunces',serif;font-weight:600;font-size:158px;line-height:1;margin-top:26px;letter-spacing:-2px}
  .rule{width:110px;height:7px;border-radius:4px;background:#7FB08C;margin:30px 0 28px}
  .tag{font-size:46px;font-weight:500;opacity:.95}
  .url{position:absolute;bottom:74px;font-size:24px;font-weight:500;opacity:.55;letter-spacing:.8px}
</style></head>
<body>
<div class="art">
  <div class="bowl">
    <svg viewBox="0 0 1024 1024" width="380" height="380">
      <g fill="none" stroke="#FBF7F2" stroke-width="30" stroke-linecap="round">
        <path d="M430 424 C 398 372, 462 352, 430 300"/>
        <path d="M512 430 C 480 378, 544 358, 512 300"/>
        <path d="M594 424 C 562 372, 626 352, 594 300"/>
      </g>
      <ellipse cx="512" cy="520" rx="214" ry="48" fill="#FBF7F2"/>
      <path d="M300 520 A 214 214 0 0 0 724 520 Z" fill="#FBF7F2"/>
      <ellipse cx="512" cy="520" rx="150" ry="30" fill="#5E8B6A" opacity="0.22"/>
      <rect x="312" y="702" width="400" height="28" rx="14" fill="#7FB08C"/>
    </svg>
  </div>
  <div class="word">Sofra</div>
  <div class="rule"></div>
  <div class="tag">Your family's meal memory</div>
  <div class="url">sofra.savvylabs.dev</div>
</div>
</body></html>
