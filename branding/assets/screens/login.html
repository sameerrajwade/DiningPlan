<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--terra:#C0532E;--bg:#FBF7F2;--card:#FFFFFF;--tx:#241E1B;--tx2:#6E645C;--tx3:#A79C93;--bd:#EAE2D8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:2706px}
  .phone{width:1280px;height:2706px;background:var(--bg);font-family:'Inter',sans-serif;color:var(--tx);
    padding:230px 64px 0;display:flex;flex-direction:column;align-items:center}
  .logo{width:200px;height:200px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center}
  .brand{font-family:'Fraunces',serif;font-size:92px;font-weight:600;color:var(--terra);margin-top:44px}
  .tag{font-size:40px;color:var(--tx2);margin-top:14px}
  .field{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:24px;height:132px;display:flex;align-items:center;gap:28px;padding:0 40px;margin-top:36px;font-size:44px;color:var(--tx3)}
  .field.first{margin-top:80px}
  .btn{width:100%;height:132px;border-radius:24px;background:var(--terra);color:#fff;font-size:46px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:36px}
  .link{color:var(--terra);font-size:40px;font-weight:600;margin-top:44px}
  .or{display:flex;align-items:center;gap:28px;width:100%;margin:52px 0;color:var(--tx3);font-size:36px;font-weight:600}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}
  .gbtn{width:100%;height:132px;border-radius:24px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:26px;font-size:44px;font-weight:600}
  .eye{margin-left:auto}
  svg{display:block}
</style></head>
<body>
<div class="phone">
  <div class="logo">
    <svg viewBox="0 0 1024 1024" width="132" height="132">
      <g fill="none" stroke="#FBF7F2" stroke-width="34" stroke-linecap="round">
        <path d="M430 424 C 398 372, 462 352, 430 300"/><path d="M512 430 C 480 378, 544 358, 512 300"/><path d="M594 424 C 562 372, 626 352, 594 300"/></g>
      <ellipse cx="512" cy="520" rx="214" ry="48" fill="#FBF7F2"/>
      <path d="M300 520 A 214 214 0 0 0 724 520 Z" fill="#FBF7F2"/>
      <rect x="312" y="702" width="400" height="28" rx="14" fill="#5E8B6A"/>
    </svg>
  </div>
  <div class="brand">Sofra</div>
  <div class="tag">Plan meals, not stress</div>

  <div class="field first"><svg width="46" height="46" viewBox="0 0 24 24"><path fill="#6E645C" d="M3 5h18v14H3z" opacity=".15"/><path fill="none" stroke="#6E645C" stroke-width="2" d="M3 6h18v12H3z M3 7l9 6 9-6"/></svg>Email</div>
  <div class="field"><svg width="42" height="42" viewBox="0 0 24 24"><path fill="none" stroke="#6E645C" stroke-width="2" d="M6 10V8a6 6 0 1112 0v2 M5 10h14v10H5z"/></svg>Password
    <svg class="eye" width="46" height="46" viewBox="0 0 24 24"><path fill="none" stroke="#6E645C" stroke-width="2" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="#6E645C"/></svg></div>
  <div class="btn">Sign In</div>
  <div class="link">Forgot password?</div>
  <div class="or">OR</div>
  <div class="gbtn"><span style="font-family:Fraunces,serif;font-size:46px;font-weight:700">G</span> Continue with Google</div>
  <div class="link">Don't have an account? <b>Sign up</b></div>
</div>
</body></html>
