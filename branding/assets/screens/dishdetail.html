<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--terra:#C0532E;--terraL:#F8E9E2;--sage:#5E8B6A;--sageL:#E7F0E9;--amber:#E0A63C;
    --bg:#FBF7F2;--card:#FFFFFF;--sv:#F3EEE7;--tx:#241E1B;--tx2:#6E645C;--tx3:#A79C93;--bd:#EAE2D8;--err:#B23A2E}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:2706px}
  .phone{width:1280px;height:2706px;background:var(--bg);position:relative;overflow:hidden;font-family:'Inter',sans-serif;color:var(--tx)}
  .frns{font-family:'Fraunces',serif}
  .scrim{position:absolute;inset:0;background:rgba(36,30,27,.45)}
  .sheet{position:absolute;left:44px;right:44px;top:280px;background:var(--card);border-radius:44px;padding:56px 54px;box-shadow:0 40px 90px rgba(36,30,27,.3)}
  .htop{display:flex;justify-content:space-between;align-items:flex-start}
  .title{font-size:60px;font-weight:600}
  .meta{display:flex;gap:16px;margin-top:20px}
  .cz{background:var(--terra);color:#fff;font-size:28px;font-weight:600;padding:10px 26px;border-radius:34px}
  .tag{color:var(--tx2);font-size:30px;padding:10px 0}
  .x{font-size:52px;color:var(--tx3)}
  .stats{display:flex;gap:44px;margin-top:30px}
  .stats .s{display:flex;align-items:center;gap:14px;font-size:31px;color:var(--tx2);font-weight:500}
  .lbl{font-size:31px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx2);margin:46px 0 12px}
  .hint{font-size:29px;color:var(--tx3);margin-bottom:20px}
  .ing{display:flex;align-items:center;gap:26px;padding:26px 0;border-bottom:1px solid var(--bd)}
  .cb{width:48px;height:48px;border-radius:13px;background:var(--terra);display:flex;align-items:center;justify-content:center;flex:none}
  .ing .n{flex:1;font-size:40px}
  .grocbtn{margin-top:34px;background:var(--terra);color:#fff;border-radius:26px;padding:34px;text-align:center;font-size:38px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:18px}
  .recipe{margin-top:20px;border:2px solid var(--terra);border-radius:24px;padding:30px 34px;display:flex;align-items:center;gap:18px;color:var(--terra);font-size:36px;font-weight:600;width:max-content}
  .note{margin-top:20px;background:var(--sv);border-radius:22px;padding:30px 34px;font-size:34px;color:var(--tx2);line-height:1.5}
  .del{color:var(--err);font-size:34px;font-weight:600;margin-top:42px;display:flex;align-items:center;gap:14px}
  svg{display:block}
</style></head>
<body>
<div class="phone">
  <div class="scrim"></div>
  <div class="sheet">
    <div class="htop">
      <div><div class="title frns">Grilled Salmon</div>
        <div class="meta"><span class="cz">🐟 American</span><span class="tag">main</span></div>
      </div>
      <div class="x">✕</div>
    </div>
    <div class="stats">
      <div class="s">🍴 Cooked 6×</div>
      <div class="s">📅 Last made Sep 1, 2026</div>
    </div>

    <div class="lbl">Ingredients</div>
    <div class="hint">Tick the ones you need to buy</div>
    <div class="ing"><div class="cb"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="n">Salmon Fillet</div></div>
    <div class="ing"><div class="cb"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="n">Lemon</div></div>
    <div class="ing"><div class="cb"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="n">Green Beans</div></div>
    <div class="ing"><div class="cb"><svg width="26" height="26" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="n">Olive Oil</div></div>

    <div class="grocbtn">🛒 Add 4 to grocery</div>

    <div class="lbl">Recipe</div>
    <div class="recipe">▶ Watch on YouTube</div>

    <div class="lbl">Notes</div>
    <div class="note">Sear skin-side down 4 min, finish in the oven. The kids like it with extra lemon.</div>

    <div class="del">🗑 Delete dish</div>
  </div>
</div>
</body></html>
