<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--terra:#C0532E;--sage:#5E8B6A;--sageL:#E7F0E9;--amber:#E0A63C;--kids:#4A6FA5;
    --bg:#FBF7F2;--card:#FFFFFF;--sv:#F3EEE7;--tx:#241E1B;--tx2:#6E645C;--tx3:#A79C93;--bd:#EAE2D8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:2706px}
  .phone{width:1280px;height:2706px;background:var(--bg);position:relative;overflow:hidden;
    font-family:'Inter',sans-serif;color:var(--tx);padding:80px 48px 0}
  .frns{font-family:'Fraunces',serif}
  .h1{font-size:66px;font-weight:600}
  .addrow{display:flex;align-items:center;gap:20px;margin-top:46px}
  .addinput{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:34px 38px;font-size:34px;color:var(--tx3);display:flex;align-items:center;gap:20px}
  .addbtn{width:96px;height:96px;border-radius:50%;background:var(--sv);display:flex;align-items:center;justify-content:center;flex:none}
  .pull{margin-top:26px;border:2px dashed var(--terra);border-radius:26px;padding:32px 38px;display:flex;align-items:center;gap:20px;color:var(--terra);font-size:36px;font-weight:600}
  .summary{display:flex;justify-content:space-between;align-items:center;margin:44px 6px 24px}
  .summary .s{font-size:34px;font-weight:500;color:var(--tx2)}
  .summary .m{font-size:40px;color:var(--tx3);letter-spacing:3px}
  .item{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:34px 36px;display:flex;align-items:center;gap:28px;margin-bottom:20px}
  .box{width:52px;height:52px;border-radius:14px;border:3px solid var(--tx3);flex:none}
  .box.on{background:var(--terra);border-color:var(--terra);display:flex;align-items:center;justify-content:center}
  .iname{font-size:44px;font-weight:400;flex:1}
  .item.done .iname{color:var(--tx3);text-decoration:line-through}
  .tag{color:var(--tx3);font-size:34px}
  .nav{position:absolute;left:0;right:0;bottom:0;height:190px;background:var(--bg);border-top:1px solid var(--bd);display:flex;padding:26px 30px 40px}
  .nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:27px;color:var(--tx3);font-weight:500}
  svg{display:block}
</style></head>
<body>
<div class="phone">
  <div class="h1 frns">Grocery</div>

  <div class="addrow">
    <div class="addinput">＋&nbsp;&nbsp;Add an item (e.g. dishwashing pods)</div>
    <div class="addbtn"><svg width="46" height="46" viewBox="0 0 24 24"><path fill="none" stroke="#C0532E" stroke-width="2.4" stroke-linecap="round" d="M12 19V5 M5 12l7-7 7 7"/></svg></div>
  </div>

  <div class="pull"><svg width="42" height="42" viewBox="0 0 24 24"><path fill="none" stroke="#C0532E" stroke-width="2" d="M4 5h16v16H4z M4 9h16 M8 3v4 M16 3v4"/><path fill="none" stroke="#C0532E" stroke-width="2" stroke-linecap="round" d="M12 12v6 M9 15l3 3 3-3"/></svg> Add this week's plan ingredients ›</div>

  <div class="summary"><div class="s">7 to buy · 3 done</div><div class="m">···</div></div>

  <div class="item"><div class="box"></div><div class="iname">Salmon Fillet</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Green Beans</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Bell Peppers</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Broccoli</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Spaghetti</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Ground Beef</div><div class="tag">🍴</div></div>
  <div class="item"><div class="box"></div><div class="iname">Dishwashing Pods</div></div>
  <div class="item done"><div class="box on"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="iname">Olive Oil</div></div>
  <div class="item done"><div class="box on"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="iname">Lemon</div><div class="tag">🍴</div></div>
  <div class="item done"><div class="box on"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" d="M5 13l4 4L19 7"/></svg></div><div class="iname">Tomatoes</div><div class="tag">🍴</div></div>

  <div class="nav">
    <a><svg width="46" height="46" viewBox="0 0 24 24"><path fill="#A79C93" d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>Home</a>
    <a><svg width="44" height="44" viewBox="0 0 24 24"><path fill="none" stroke="#A79C93" stroke-width="2" d="M4 5h16v16H4z M4 9h16 M8 3v4 M16 3v4"/></svg>Calendar</a>
    <a><svg width="44" height="44" viewBox="0 0 24 24"><path fill="none" stroke="#A79C93" stroke-width="2" stroke-linecap="round" d="M5 19 15 9l-1-1L4 18z M15 9l2-2 M16 4l1 1 M20 8l-1-1"/></svg>Plan</a>
    <a><svg width="44" height="44" viewBox="0 0 24 24"><path fill="#A79C93" d="M4 13h3v7H4z M10 8h3v12h-3z M16 4h3v16h-3z"/></svg>Insights</a>
    <a><svg width="44" height="44" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#A79C93"/><path fill="#A79C93" d="M4 21c0-4 4-6 8-6s8 2 8 6z"/></svg>Profile</a>
  </div>
</div>
</body></html>
