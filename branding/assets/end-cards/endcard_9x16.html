<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px}
.card{width:1080px;height:1920px;
  background:radial-gradient(120% 85% at 50% 12%, rgba(192,83,46,.10), rgba(94,139,106,.06) 55%, rgba(251,247,242,0) 78%), #FBF7F2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  font-family:'Inter',sans-serif;color:#241E1B;gap:72px;padding:90px}
.logo{display:flex;align-items:center;justify-content:center;gap:34px}
.tile{width:170px;height:170px;display:block}
.word{font-family:'Fraunces',serif;font-weight:600;font-size:150px;color:#C0532E;line-height:1}
.tag{font-family:'Fraunces',serif;font-size:90px;font-weight:600;color:#3a322d;line-height:1.15}
.pills{display:flex;flex-direction:column;gap:34px;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:26px;
  background:#C0532E;color:#FBF7F2;border-radius:30px;padding:30px 52px;width:700px;
  box-shadow:0 10px 30px rgba(192,83,46,.22)}
.gl{width:54px;height:54px;flex-shrink:0;display:block}
.pt{text-align:left}
.pt small{display:block;font-size:27px;font-weight:500;opacity:.85;line-height:1.1}
.pt b{display:block;font-size:48px;font-weight:700;line-height:1.15}
.web{font-size:46px;font-weight:600;color:#C0532E;letter-spacing:3px;margin-top:6px}
</style></head><body><div class="card">
  <div class="logo"><svg class="tile" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="224" fill="#C0532E"/>
  <g fill="none" stroke="#FBF7F2" stroke-width="28" stroke-linecap="round">
    <path d="M430 424 C 398 372, 462 352, 430 300"/><path d="M512 430 C 480 378, 544 358, 512 300"/><path d="M594 424 C 562 372, 626 352, 594 300"/>
  </g>
  <ellipse cx="512" cy="520" rx="214" ry="48" fill="#FBF7F2"/>
  <path d="M300 520 A 214 214 0 0 0 724 520 Z" fill="#FBF7F2"/>
  <ellipse cx="512" cy="520" rx="150" ry="30" fill="#5E8B6A" opacity="0.22"/>
  <rect x="312" y="702" width="400" height="28" rx="14" fill="#5E8B6A"/></svg><span class="word">Sofra</span></div>
  <div class="tag">Plan meals,<br>remember it all.</div>
  <div class="pills">

</div></body></html>
